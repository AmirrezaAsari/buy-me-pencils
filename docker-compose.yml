version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: buy-me-pencils-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buy_me_pencils
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - '5433:5432'  # host 5433 to avoid conflict with local PostgreSQL or reserved port
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buy-me-pencils-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - '3002:3002'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    container_name: buy-me-pencils-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db_data:

